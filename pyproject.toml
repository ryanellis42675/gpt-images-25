[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gpt-images-25"
version = "0.1.0"
description = "Official client SDK and utilities for GPT images 2.5 - Free AI Image Generator & Editor (https://images25.art)"
readme = "README.md"
authors = [{ name = "GPT images 2.5 Team", email = "ryanellis42675@gmail.com" }]
license = { text = "MIT" }
keywords = ["gpt-images", "ai-image-generator", "photo-editor", "gpt-images-25"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.8"

[project.urls]
"Homepage" = "https://images25.art"
"Documentation" = "https://images25.art"
"Source" = "https://github.com/ryanellis42675/gpt-images-25"
"Bug Tracker" = "https://images25.art"
